[project]
name = "nefs-python-workshop"
version = "0.1.0"
description = "A one-hour introduction to Python for quantitative finance"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel==7.4.0",
    "jupyterlab==4.5.6",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.0.5",
    "polars==1.44.1",
    "pyarrow==25.0.1",
    "scipy==1.18.0",
]

[dependency-groups]
dev = ["mypy==2.4.0", "nbclient==0.11.0", "nbformat==5.11.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_workshop"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/quant_workshop", "lessons", "native/build.py"]
untyped_calls_exclude = ["IPython", "nbformat"]

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*"]
ignore_missing_imports = true
